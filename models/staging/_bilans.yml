version: 2

models:
  - name: stg_hdl
    description: "Cholestérol HDL (laboratoire, fichier CDC HDL_L). Unité probable : mg/dL, à confirmer dans le codebook."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: hdl
        description: "Cholestérol HDL."

  - name: stg_tchol
    description: "Cholestérol total (laboratoire, fichier CDC TCHOL_L). Unité probable : mg/dL, à confirmer dans le codebook."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: cholesterol_total
        description: "Cholestérol total."

  - name: stg_trigly
    description: "Triglycérides et LDL (laboratoire, fichier CDC TRIGLY_L). Unités probables : mg/dL, à confirmer dans le codebook. Le fichier contient trois versions du LDL, seule la première (lbdldl) est conservée."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: triglycerides
        description: "Triglycérides (colonne lbxtlg). Valeurs extrêmes possibles (maximum observé : 1 745)."
      - name: ldl
        description: "Cholestérol LDL (colonne lbdldl)."

  - name: stg_ghb
    description: "Hémoglobine glyquée (laboratoire, fichier CDC GHB_L). Unité probable : pourcentage, à confirmer dans le codebook."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: hba1c
        description: "Hémoglobine glyquée."

  - name: stg_cbc
    description: "Numération sanguine (fichier CDC CBC_L), ici seulement l'hémoglobine. Unité probable : g/dL, à confirmer dans le codebook."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: hemoglobine
        description: "Hémoglobine."