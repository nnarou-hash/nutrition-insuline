version: 2

models:
  - name: stg_hdl
    description: "Cholestérol HDL (laboratoire, fichier CDC HDL_L). Unité : mg/dL (codebook CDC)."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: hdl
        description: "Cholestérol HDL."

  - name: stg_tchol
    description: "Cholestérol total (laboratoire, fichier CDC TCHOL_L). Unité : mg/dL (codebook CDC)."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: cholesterol_total
        description: "Cholestérol total."

  - name: stg_trigly
    description: "Triglycérides et LDL (laboratoire, fichier CDC TRIGLY_L). Unités : mg/dL (codebook CDC). Le fichier contient trois méthodes de calcul du LDL (Friedewald, Martin-Hopkins, NIH équation 2) ; seule la méthode de Friedewald (lbdldl) est conservée."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: triglycerides
        description: "Triglycérides (colonne lbxtlg). Valeurs extrêmes possibles (maximum observé : 1 745)."
      - name: ldl
        description: "Cholestérol LDL, méthode de Friedewald (colonne lbdldl)."

  - name: stg_ghb
    description: "Hémoglobine glyquée (laboratoire, fichier CDC GHB_L). Unité : pourcentage (codebook CDC)."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: hba1c
        description: "Hémoglobine glyquée."

  - name: stg_cbc
    description: "Numération sanguine (fichier CDC CBC_L), ici seulement l'hémoglobine. Unité : g/dL (codebook CDC)."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: hemoglobine
        description: "Hémoglobine."
  - name: stg_ferritine
    description: "Ferritine (laboratoire, fichier CDC FERTIN_L), mesurée dans cet échantillon uniquement chez des femmes de 18 à 49 ans. Unité : ng/mL (codebook CDC)."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: ferritine
        description: "Ferritine en ng/mL (colonne lbxfer)."
