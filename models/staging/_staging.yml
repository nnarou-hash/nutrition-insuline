version: 2

models:
  - name: stg_demo
    description: >
      Démographie NHANES 2021-2023 nettoyée : un participant par ligne.
      Les codes "refus" et "ne sait pas" du niveau d'éducation sont recodés
      en vide, avec un indicateur pour garder la trace.
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn), clé commune à toutes les tables."
        tests:
          - unique
          - not_null
      - name: sexe_code
        description: "Sexe déclaré : 1 = homme, 2 = femme."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: age_annees
        description: "Âge en années au dépistage. Plafonné à 80 (80 = 80 ans et plus)."
        tests:
          - not_null
      - name: a_ete_examine
        description: "Vrai si le participant a passé l'examen en centre mobile (ridstatr = 2)."
        tests:
          - not_null
      - name: grossesse_code
        description: >
          Statut de grossesse à l'examen, femmes de 20 à 44 ans seulement :
          1 = enceinte, 2 = non enceinte, 3 = indéterminé. Vide hors cible.
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: niveau_education_code
        description: >
          Niveau d'éducation des 20 ans et plus (1 à 5). Vide si hors cible
          (moins de 20 ans) ou si "ne sait pas".
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: education_refus_ou_nsp
        description: "Vrai si la réponse d'origine était refus (7) ou ne sait pas (9)."
        tests:
          - not_null
      - name: ratio_revenu_seuil_pauvrete
        description: "Ratio revenu du foyer / seuil de pauvreté. Plafonné à 5 (5 = 5,00 ou plus)."
      - name: poids_sondage_examen
        description: "Poids de sondage de l'examen. 0 = participant non examiné."

  - name: stg_ins
    description: >
      Insuline à jeun, sous-échantillon à jeun uniquement. Les zéros mal lus
      du fichier XPT sont corrigés par la macro clean_zero.
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: poids_sondage_jeun
        description: "Poids de sondage du sous-échantillon à jeun."
      - name: insuline_uu_ml
        description: "Insuline à jeun en uU/mL. Vide si non mesurée."
      - name: insuline_pmol_l
        description: "Insuline à jeun en pmol/L. Vide si non mesurée."
      - name: insuline_code_limite_detection
        description: "Code de limite de détection : 0 = résultat détectable, 1 = sous la limite de détection (0,5 uU/mL). Dans ce cas, la valeur d'insuline est une valeur imputée (limite / racine de 2)."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
  - name: stg_glu
    description: "Glycémie plasmatique à jeun, sous-échantillon à jeun uniquement."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: poids_sondage_jeun
        description: "Poids de sondage du sous-échantillon à jeun."
      - name: glycemie_mg_dl
        description: "Glycémie à jeun en mg/dL. Vide si non mesurée."
      - name: glycemie_mmol_l
        description: "Glycémie à jeun en mmol/L. Vide si non mesurée."

  - name: stg_fastqx
    description: "Questionnaire de jeûne : durée de jeûne déclarée avant la prise de sang."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: jeune_heures
        description: "Heures de jeûne déclarées."
      - name: jeune_minutes
        description: "Minutes de jeûne déclarées (en plus des heures)."

  - name: stg_bmx
    description: "Mesures corporelles de l'examen (poids, taille, IMC, tour de taille). Inclut les enfants : à restreindre aux adultes pour les analyses."
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: poids_kg
        description: "Poids en kg. Vide si non mesuré."
      - name: taille_cm
        description: "Taille en cm. Vide si non mesurée."
      - name: imc
        description: "Indice de masse corporelle (kg/m²). Vide si non calculé."
      - name: tour_taille_cm
        description: "Tour de taille en cm. Vide si non mesuré."

  - name: stg_paq
    description: >
      Activité physique de loisir déclarée (adultes de 18 ans et plus).
      Les codes refus (7777) et ne sait pas (9999) sont recodés en vide,
      avec un indicateur pour garder la trace.
    columns:
      - name: participant_id
        description: "Identifiant du participant (seqn)."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: participant_id
      - name: moderee_frequence
        description: "Nombre de fois où le participant pratique une activité modérée, dans l'unité de moderee_unite."
      - name: moderee_unite
        description: "Unité de la fréquence modérée : D = jour, W = semaine, M = mois, Y = année. Vide si non posée."
        tests:
          - accepted_values:
              arguments:
                values: ['D', 'W', 'M', 'Y']
      - name: moderee_minutes
        description: "Minutes par séance d'activité modérée."
      - name: intense_frequence
        description: "Nombre de fois où le participant pratique une activité intense, dans l'unité de intense_unite."
      - name: intense_unite
        description: "Unité de la fréquence intense : D = jour, W = semaine, M = mois, Y = année. Vide si non posée."
        tests:
          - accepted_values:
              arguments:
                values: ['D', 'W', 'M', 'Y']
      - name: intense_minutes
        description: "Minutes par séance d'activité intense."
      - name: sedentaire_minutes
        description: "Minutes passées assis lors d'une journée habituelle (hors sommeil)."
      - name: paq_refus_ou_nsp
        description: "Vrai si au moins une réponse numérique d'origine était refus (7777) ou ne sait pas (9999)."
        tests:
          - not_null